[package]
name = "omni-rmt-spca"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Pinned by rev, not path: omnibenchmark clones this module into
# out_*/.modules/omni-rmt-spca/<sha>/ and may run on a machine that has no local
# checkout, so a path dep (relative OR absolute) is not portable.
#
# a2c6028 is the pushed tip of main. The commit that matters underneath it is
# 891e127 (configurable k_max + bw_damp default 0.3); anything at or before
# 5317740 will NOT compile against this module, since FistaConfig has no k_max
# field there. Pinned to the tip rather than 891e127 so the pin matches what is
# actually on the branch.
rmt-spca = { git = "https://github.com/btraven00/rmt-spca", rev = "a2c6028" }
faer = "0.19"

[profile.release]
opt-level = 3
