[package]
name = "omni-rmt-spca"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Pinned by rev, not path: omnibenchmark clones this module into
# out_*/.modules/omni-rmt-spca/<sha>/ and may run on a machine that has no local
# checkout, so a path dep (relative OR absolute) is not portable.
#
# 1d9cd09 is the commit that makes k_max configurable and changes the bw_damp
# default to 0.3. Anything older will NOT compile against this module:
# FistaConfig has no k_max field before it.
rmt-spca = { git = "https://github.com/btraven00/rmt-spca", rev = "1d9cd09" }
faer = "0.19"

[profile.release]
opt-level = 3
